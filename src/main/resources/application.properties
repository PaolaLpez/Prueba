spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pao1818}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 1. BLINDAJE POOL DE CONEXIONES HIKARICP (ANTI-SATURACIÓN JMETER)
# ===================================================================
# Máximo de conexiones concurrentes a la base de datos (por defecto solo son 10)
spring.datasource.hikari.maximum-pool-size=30
# Conexiones mínimas inactivas reservadas en memoria listas para responder
spring.datasource.hikari.minimum-idle=10
# Tiempo máximo (ms) que una petición espera por una conexión antes de fallar (5s en vez de 30s)
spring.datasource.hikari.connection-timeout=5000
# Tiempo máximo que una conexión inactiva permanece en el pool
spring.datasource.hikari.idle-timeout=300000
# Tiempo de vida máximo de una conexión antes de renovarla limpiamente
spring.datasource.hikari.max-lifetime=1200000
# Detección de fugas de conexión: reporta consultas lentas que retengan conexiones
spring.datasource.hikari.leak-detection-threshold=4000
# Optimización de caché de sentencias preparadas en el driver JDBC
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# Configuración JPA / Hibernate para PostgreSQL 16
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false
# Deshabilitar open-in-view para liberar conexiones de BD inmediatamente tras salir del servicio
spring.jpa.open-in-view=false

# Cache Redis de productos. Si Redis no esta disponible, el servicio usa PostgreSQL.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
productos.sincronizacion.cron=${PRODUCTOS_SINCRONIZACION_CRON:0 0 6 * * *}
productos.cache.key=${PRODUCTOS_CACHE_KEY:productos:actuales}

# ===================================================================
# 2. OPTIMIZACIÓN DE SERVIDOR APACHE TOMCAT
# ===================================================================
# Puerto del servidor (Render inyecta PORT dinámicamente en producción)
server.port=${PORT:8080}

# Máximo de hilos concurrentes para procesar peticiones HTTP simultáneas
server.tomcat.threads.max=300
# Hilos mínimos mantenidos en espera siempre listos
server.tomcat.threads.min-spare=25
# Cola de peticiones en espera cuando todos los hilos están ocupados
server.tomcat.accept-count=200
# Máximo de conexiones TCP abiertas concurrentes
server.tomcat.max-connections=10000
# Timeout de conexión HTTP (ms)
server.tomcat.connection-timeout=15000
# Reutilización de conexiones Keep-Alive
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-keep-alive-requests=100

# Compresión HTTP (reduce ancho de banda en 75% durante pruebas masivas)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===================================================================
# 3. ESCUDO DE PROTECCIÓN RATE LIMITING Y BULKHEAD
# ===================================================================
# Habilitar el filtro de protección contra ráfagas excesivas
app.security.rate-limiter.enabled=true
# Peticiones permitidas por segundo por cliente / IP
app.security.rate-limiter.requests-per-second=60
# Capacidad máxima de ráfaga (burst) permitida por IP
app.security.rate-limiter.burst-capacity=90
# Máximo de peticiones concurrentes simultáneas en todo el servidor (Bulkhead)
app.security.rate-limiter.max-concurrent-requests=200

# Configuración de Timeouts para clientes OpenFeign (en milisegundos)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=8000

