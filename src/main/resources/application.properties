# Configuración del servicio externo de productos
producto.service.url=https://gestopago.portalventas.net
producto.service.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummyToken

# Configuración de Jackson para omitir atributos nulos en respuestas JSON
spring.jackson.default-property-inclusion=non_null

# Deshabilitar Spring Cloud Config Client para permitir ejecución local sin servidor de configuración
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Configuración requerida por el servicio existente GestoPagoAuthClient
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.api-key=YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8
gestopago.auth.refresh-rate-ms=3600000

# Configuración de Base de Datos PostgreSQL 18
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prueba_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pao1818}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate para PostgreSQL 18
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Cache Redis de productos. Si Redis no esta disponible, el servicio usa PostgreSQL.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
productos.sincronizacion.cron=${PRODUCTOS_SINCRONIZACION_CRON:0 0 6 * * *}
productos.cache.key=${PRODUCTOS_CACHE_KEY:productos:actuales}

# Configuración de Timeouts para clientes OpenFeign (en milisegundos)
spring.cloud.openfeign.client.config.default.connect-timeout=20000
spring.cloud.openfeign.client.config.default.read-timeout=60000
