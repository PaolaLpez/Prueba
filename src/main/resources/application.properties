# Configuración del servicio externo de productos
producto.service.url=https://api.ejemplo.com
producto.service.token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummyToken

# Configuración de Jackson para omitir atributos nulos en respuestas JSON
spring.jackson.default-property-inclusion=non_null

# Deshabilitar Spring Cloud Config Client para permitir ejecución local sin servidor de configuración
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Configuración requerida por el servicio existente GestoPagoAuthClient
gestopago.auth.url=https://api.gestopago.com
gestopago.auth.id-distribuidor=12345
gestopago.auth.codigo-dispositivo=DEV001
gestopago.auth.password=secret123
gestopago.auth.refresh-rate-ms=3600000

# Configuración de Base de Datos H2 en memoria para ejecución local
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
